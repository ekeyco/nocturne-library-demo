<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Nocturne Library — Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23140808' stroke='%23d8b46a' stroke-width='3'/%3E%3Cpath d='M32 50c0-6 0-10 0-16' stroke='%234a6a2a' stroke-width='2'/%3E%3Ccircle cx='32' cy='27' r='13' fill='%23b01430'/%3E%3Cpath d='M20 28c0-9 8-13 14-12s10 6 10 11c-6-5-15-5-24 1z' fill='%23e2384e'/%3E%3Cpath d='M24 26c3-4 9-5 12-2' stroke='%237a0618' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Pinyon+Script&family=Homemade+Apple&family=IM+Fell+English:ital@0;1&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THE NOCTURNE LIBRARY — web edition · EkeyCo
   ============================================================ */
:root{
  --night:#0f0b08; --night2:#16110c; --panel:#1d1711; --panel2:#251d15; --raise:#2e251b;
  --ink:#0a0705; --line:rgba(194,166,118,.18); --line2:rgba(194,166,118,.32);
  --gilt:#c9a86a; --gilt2:#f1d79a; --gilt3:#8a6a3a; --bronze:#735c40;
  --parch:#ece0c4; --ivory:#f6eedd; --dim:#a0947c; --mute:#6f6553;
  --accent:#8c2a2e; --accent2:#c0444a; --accentSoft:rgba(140,42,46,.35);
  --moss:#3e4a36; --mossL:#6f7d5c; --sage:#a3a99a;
  --wood1:#3b2414; --wood2:#5a3a22; --wood3:#24150b;
  --glow:255,176,80;
  --r:14px; --r2:20px;
  --fT:'Cinzel Decorative',serif; --fH:'Cinzel',serif; --fB:'EB Garamond',serif; --fN:'Cormorant Garamond',serif;
  --fS:'Pinyon Script',cursive; --fW:'Homemade Apple',cursive; --fM:'IM Fell English',serif;
  --shadow:0 18px 40px -18px rgba(0,0,0,.85), 0 2px 0 rgba(255,236,190,.04) inset;
}
body[data-theme="bloodmoon"]{ --night:#0d0607; --night2:#150a0b; --panel:#1c0d0f; --panel2:#251214; --raise:#2f171a; --accent:#a3242d; --accent2:#e04a50; --gilt:#d6a46e; --gilt2:#ffd2a0; --line:rgba(214,164,110,.18); --line2:rgba(214,164,110,.34); --moss:#4a1e22; --mossL:#8a3a40; --glow:255,90,70;}
body[data-theme="absinthe"]{ --night:#070b08; --night2:#0c120d; --panel:#111a13; --panel2:#172219; --raise:#1e2b20; --accent:#4f7a3a; --accent2:#93c45a; --gilt:#b9c27a; --gilt2:#e6efa6; --gilt3:#6f7a3a; --line:rgba(185,194,122,.18); --line2:rgba(185,194,122,.34); --glow:170,255,120;}
body[data-theme="bone"]{ --night:#e8dcc2; --night2:#efe5cf; --panel:#f6eedc; --panel2:#efe4cb; --raise:#e6d8b8; --ink:#2a1d12; --line:rgba(90,58,34,.22); --line2:rgba(90,58,34,.38); --gilt:#7a5320; --gilt2:#a8742e; --gilt3:#5a3a14; --parch:#2b1f14; --ivory:#1f160d; --dim:#6b5a42; --mute:#8d7c60; --accent:#8c2a2e; --accent2:#a8343a; --glow:255,190,110; --shadow:0 18px 30px -20px rgba(60,35,10,.45);}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--night);color:var(--parch);font-family:var(--fB);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--gilt2)}
::selection{background:var(--accentSoft)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:linear-gradient(var(--gilt3),var(--bronze));border-radius:10px;border:2px solid var(--night)}::-webkit-scrollbar-track{background:transparent}

/* ---------- atmosphere ---------- */
#atmo{position:fixed;inset:0;pointer-events:none;z-index:1}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55) 100%)}
body[data-theme="bone"] .vignette{background:radial-gradient(120% 90% at 50% 40%,transparent 60%,rgba(70,40,10,.22) 100%)}
.candlelight{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(60% 50% at 82% 8%,rgba(var(--glow),.10),transparent 70%),radial-gradient(40% 40% at 10% 100%,rgba(var(--glow),.06),transparent 70%);animation:flick 5s infinite steps(1)}
@keyframes flick{0%{opacity:1}12%{opacity:.86}14%{opacity:1}43%{opacity:.93}45%{opacity:1}71%{opacity:.82}73%{opacity:.97}88%{opacity:.9}}
.stone{position:fixed;inset:0;z-index:0;background:var(--night) var(--stone);background-blend-mode:overlay}

/* ---------- layout ---------- */
#app{position:relative;z-index:3;display:grid;grid-template-columns:232px 1fr;height:100vh}
#side{position:relative;display:flex;flex-direction:column;padding:18px 14px 14px;background:var(--wood3) var(--woodtex);background-blend-mode:multiply;border-right:1px solid var(--line2);box-shadow:inset -12px 0 24px -12px rgba(0,0,0,.8)}
#side::before{content:"";position:absolute;inset:6px;border:1px solid var(--line);border-radius:10px;pointer-events:none}
body[data-theme="bone"] #side{background:#d9c7a1 var(--woodtex);background-blend-mode:soft-light}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
.brand .sig{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--gilt2),var(--gilt3));color:var(--ink);font-family:var(--fT);font-size:20px;box-shadow:0 0 0 2px var(--ink),0 0 0 3px var(--gilt3),0 6px 14px rgba(0,0,0,.6)}
.brand b{display:block;font-family:var(--fT);font-size:15px;line-height:1.05;color:var(--gilt2);letter-spacing:.02em}
.brand small{font-family:var(--fS);font-size:15px;color:var(--dim)}
.searchbox{display:flex;align-items:center;gap:8px;margin:2px 4px 10px;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--dim)}
.searchbox input{flex:1;background:none;border:0;outline:0;font-size:14px;color:var(--parch)}
.addbtn{margin:0 4px 12px;padding:10px 12px;border-radius:12px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff4e6;font-family:var(--fH);font-size:13px;letter-spacing:.12em;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 8px 18px -8px rgba(0,0,0,.9),0 0 0 1px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.addbtn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;padding:0 2px}
.nav .lbl{font-family:var(--fH);font-size:10px;letter-spacing:.22em;color:var(--mute);padding:12px 10px 4px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--parch);text-decoration:none;font-family:var(--fH);font-size:13px;letter-spacing:.06em;position:relative;transition:background .2s}
.nav a .ic{width:20px;text-align:center;color:var(--gilt);font-size:15px}
.nav a .ct{margin-left:auto;font-family:var(--fB);font-size:12px;color:var(--dim)}
.nav a:hover{background:rgba(255,230,180,.05)}
.nav a.on{background:linear-gradient(90deg,var(--accentSoft),transparent);box-shadow:inset 2px 0 0 var(--accent2)}
.nav a.on .ic{color:var(--gilt2);text-shadow:0 0 10px rgba(var(--glow),.7)}
.nowmini{margin:8px 4px 6px;padding:10px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid var(--line);display:flex;gap:10px;align-items:center;cursor:pointer}
.nowmini .c{width:34px;height:50px;border-radius:3px;overflow:hidden;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.7)}
.nowmini small{font-family:var(--fH);font-size:9px;letter-spacing:.18em;color:var(--dim);display:block}
.nowmini b{font-size:13px;display:block;line-height:1.2;max-height:2.4em;overflow:hidden}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px}
.me{display:flex;align-items:center;gap:10px;padding:8px 6px 0}
.me .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--moss));font-family:var(--fT);color:var(--ivory);box-shadow:0 0 0 2px var(--gilt3)}
.me b{font-size:13px;display:block}.me small{font-size:11px;color:var(--dim)}

#main{position:relative;overflow:auto;padding:22px 30px 60px;scroll-behavior:smooth}
.view{animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px}
.top .eyebrow{font-family:var(--fH);font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.h1{font-family:var(--fT);font-weight:700;font-size:34px;line-height:1.05;background:linear-gradient(180deg,var(--gilt2),var(--gilt) 55%,var(--gilt3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.h1 em{font-family:var(--fS);font-style:normal;font-weight:400;font-size:.9em;color:var(--accent2);-webkit-text-fill-color:var(--accent2)}
.top .sp{flex:1}
.h2{font-family:var(--fH);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gilt2);display:flex;align-items:center;gap:8px}
.h2 .sym{color:var(--accent2)}
.h2 small{font-family:var(--fB);text-transform:none;letter-spacing:0;font-size:12px;color:var(--dim)}
.sub{font-family:var(--fN);font-style:italic;color:var(--dim);font-size:15px}

/* ---------- panels (carved frames) ---------- */
.panel{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:var(--r2);padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.panel::after{content:"";position:absolute;inset:5px;border-radius:calc(var(--r2) - 5px);border:1px solid var(--line);pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) top/100% 1px no-repeat,linear-gradient(#000 0 0) bottom/100% 1px no-repeat,linear-gradient(#000 0 0) left/1px 100% no-repeat,linear-gradient(#000 0 0) right/1px 100% no-repeat}
.panel .corner{position:absolute;width:26px;height:26px;color:var(--gilt);opacity:.55;pointer-events:none}
.panel .corner.tl{top:2px;left:2px}.panel .corner.tr{top:2px;right:2px;transform:scaleX(-1)}.panel .corner.bl{bottom:2px;left:2px;transform:scaleY(-1)}.panel .corner.br{bottom:2px;right:2px;transform:scale(-1)}
.panel.dark{background:radial-gradient(120% 120% at 20% 0%,#24150f,#0d0806 70%)}
body[data-theme="bone"] .panel.dark{background:radial-gradient(120% 120% at 20% 0%,#3a2a1c,#1a110a 70%);color:#ece0c4}
.panel.wine{background:radial-gradient(130% 130% at 20% 0%,var(--accent2),var(--accent) 50%,#3a0d10)}
.panel .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panel .hd .sp{flex:1}
.grid{display:grid;gap:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--line2);font-size:12px;font-family:var(--fH);letter-spacing:.06em;color:var(--parch);background:rgba(0,0,0,.2);white-space:nowrap;transition:all .2s}
.chip b{font-family:var(--fB);font-weight:600}
.chip:hover{border-color:var(--gilt)}
.chip.on{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:transparent;color:#fff6e8;box-shadow:0 4px 12px -4px rgba(0,0,0,.8)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;font-family:var(--fH);font-size:12px;letter-spacing:.1em;border:1px solid var(--line2);background:rgba(0,0,0,.25);color:var(--parch);transition:all .2s}
.btn:hover{border-color:var(--gilt);color:var(--gilt2)}
.btn.prime{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:rgba(0,0,0,.4);color:#fff6e8;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 8px 16px -8px rgba(0,0,0,.9)}
.btn.gold{background:linear-gradient(180deg,var(--gilt2),var(--gilt) 60%,var(--gilt3));color:#1a1007;border-color:rgba(0,0,0,.4)}
.btn.sm{padding:5px 11px;font-size:11px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.seg button{padding:5px 13px;border-radius:999px;font-family:var(--fH);font-size:11px;letter-spacing:.08em;color:var(--dim)}
.seg button.on{background:var(--raise);color:var(--gilt2);box-shadow:0 2px 6px rgba(0,0,0,.6)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{padding:8px 0 10px;font-family:var(--fH);font-size:13px;letter-spacing:.08em;color:var(--dim);position:relative}
.tabs button small{color:var(--mute);font-family:var(--fB)}
.tabs button.on{color:var(--gilt2)}.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--accent2),transparent)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--fH);font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.inp{background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;outline:0;color:var(--parch);width:100%}
body[data-theme="bone"] .inp{background:rgba(255,255,255,.55)}
.inp:focus{border-color:var(--gilt);box-shadow:0 0 0 3px rgba(var(--glow),.12)}
textarea.inp{resize:vertical;min-height:80px;line-height:1.5}
.stars{display:inline-flex;gap:1px;color:var(--gilt);letter-spacing:0}
.stars i{font-style:normal;cursor:pointer;transition:transform .15s}.stars i.off{color:rgba(201,168,106,.25)}
.stars.big i{font-size:22px}.stars i:hover{transform:scale(1.2)}
.muted{color:var(--dim)}.tiny{font-size:11px}.mono{font-family:var(--fH);letter-spacing:.1em;font-size:10px;text-transform:uppercase}
.kpi b{display:block;font-family:var(--fT);font-size:26px;color:var(--ivory);line-height:1}.kpi small{font-family:var(--fH);font-size:9px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.empty{padding:40px;text-align:center;color:var(--dim);font-family:var(--fN);font-style:italic;font-size:18px}

/* ---------- covers & 3D books ---------- */
.cover{position:relative;aspect-ratio:2/3;border-radius:3px 6px 6px 3px;overflow:hidden;background:#2a1a10;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 10px 22px -8px rgba(0,0,0,.9),0 2px 4px rgba(0,0,0,.6)}
.cover img,.cover svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.45) 0,rgba(255,255,255,.18) 2.5%,rgba(0,0,0,.18) 5%,transparent 9%),linear-gradient(115deg,rgba(255,255,255,.14),transparent 35%,transparent 70%,rgba(0,0,0,.25));pointer-events:none}
.book3d{perspective:900px;display:inline-block}
.book3d .b{position:relative;transform-style:preserve-3d;transform:rotateY(-28deg) rotateX(4deg);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.book3d:hover .b{transform:rotateY(-12deg) rotateX(2deg) translateZ(10px)}
.book3d .f{position:relative;transform:translateZ(var(--th))}
.book3d .s{position:absolute;top:0;bottom:0;left:calc(var(--th)*-1);width:calc(var(--th)*2);transform:rotateY(-90deg);background:var(--spcol,#3a1a12);border-radius:2px}
.book3d .s::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(255,255,255,.14) 45%,rgba(0,0,0,.45))}
.book3d .p{position:absolute;top:1.5%;bottom:1.5%;right:calc(var(--th)*-1);width:calc(var(--th)*2);transform:rotateY(90deg);background:repeating-linear-gradient(90deg,#efe4c9 0 1px,#cfc09c 1px 2px);box-shadow:inset 0 0 6px rgba(0,0,0,.45)}
.book3d .bk{position:absolute;inset:0;transform:translateZ(calc(var(--th)*-1));background:#140b07;border-radius:3px;box-shadow:24px 26px 40px rgba(0,0,0,.75)}
.badge{position:absolute;top:7px;left:7px;z-index:2;padding:2px 8px;border-radius:999px;font-family:var(--fH);font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:rgba(10,6,4,.78);color:var(--gilt2);border:1px solid var(--line2);backdrop-filter:blur(4px)}
.badge.reading{color:#ffd9a0}.badge.finished{color:#c7e3a6}.badge.tbr{color:#f2c9a0}.badge.dnf{color:#e88b8b}.badge.wishlist{color:#e0b4ff}.badge.onhold{color:#bcd}

/* library grid */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.lcard{position:relative;cursor:pointer}
.lcard .cover{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.lcard:hover .cover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 22px 30px -12px rgba(0,0,0,.95),0 0 0 1px var(--gilt3)}
.lcard .t{margin-top:9px;font-family:var(--fN);font-weight:600;font-size:15px;line-height:1.15;color:var(--ivory);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lcard .a{font-size:12px;color:var(--dim);font-style:italic}
.lcard .stars{font-size:11px}
.pop{position:fixed;z-index:60;width:300px;padding:14px;border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);box-shadow:0 30px 60px -20px rgba(0,0,0,.95);pointer-events:none;opacity:0;transform:translateY(6px) scale(.98);transition:opacity .2s,transform .2s}
.pop.show{opacity:1;transform:none}
.pop .row{display:flex;gap:12px}.pop .row .cover{width:64px;flex:none}
.pop h4{font-family:var(--fN);font-size:18px;line-height:1.1;color:var(--ivory)}
.pop .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.pop .mini div{background:rgba(0,0,0,.3);border-radius:8px;padding:6px 8px}.pop .mini b{display:block;font-family:var(--fT);font-size:16px}.pop .mini small{font-size:9px;color:var(--dim);font-family:var(--fH);letter-spacing:.12em}
.pop p{font-size:13px;color:var(--parch);opacity:.85;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ltable{width:100%;border-collapse:collapse;font-size:14px}
.ltable th{font-family:var(--fH);font-size:10px;letter-spacing:.16em;color:var(--dim);text-align:left;padding:8px;border-bottom:1px solid var(--line2);text-transform:uppercase}
.ltable td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.ltable tr:hover td{background:rgba(255,230,180,.03)}
.ltable .cover{width:30px}
.llist{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:52px 1fr 140px 120px 90px;gap:16px;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.18);border:1px solid var(--line);cursor:pointer}
.lrow:hover{border-color:var(--line2)}

/* ---------- shelves (realistic wood) ---------- */
.shelf{position:relative;overflow:hidden;padding:18px 18px 0;border-radius:6px;background:linear-gradient(180deg,#120b06,#1d120a);box-shadow:inset 0 14px 30px -10px rgba(0,0,0,.9),inset 0 0 0 1px rgba(0,0,0,.6)}
.shelf .back{position:absolute;inset:0;border-radius:6px;background:var(--wood3) var(--backtex);background-blend-mode:multiply;opacity:.9}
.shelf .row{position:relative;display:flex;align-items:flex-end;gap:2px;min-height:150px;padding:0 6px;z-index:1}
.shelf .plank{position:relative;z-index:2;height:22px;margin:0 -18px;border-radius:2px;background:var(--wood2) var(--woodtex);background-blend-mode:multiply;box-shadow:0 1px 0 rgba(255,220,160,.35) inset,0 -3px 0 rgba(0,0,0,.35) inset,0 14px 20px -6px rgba(0,0,0,.9)}
.shelf .plank::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(180deg,rgba(255,220,170,.28),transparent)}
.shelf .plank::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:7px;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent)}
.spine{position:relative;flex:none;border-radius:2px 2px 1px 1px;cursor:pointer;transform-origin:bottom center;transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .3s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),2px 0 3px rgba(0,0,0,.55)}
.spine:hover{transform:translateY(-12px);filter:brightness(1.15);z-index:3}
.spine .bg{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:inherit;filter:saturate(1.05) contrast(1.05)}
.spine::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:1;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(255,255,255,.22) 18%,rgba(255,255,255,.05) 30%,rgba(0,0,0,.08) 60%,rgba(0,0,0,.55)),linear-gradient(180deg,rgba(0,0,0,.25),transparent 8%,transparent 92%,rgba(0,0,0,.35))}
.spine .bands{position:absolute;left:0;right:0;z-index:1;height:3px;background:linear-gradient(90deg,var(--gilt3),var(--gilt2),var(--gilt3));opacity:.85}
.spine .tt{position:absolute;inset:14px 0;z-index:2;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;font-family:var(--fH);font-size:10px;letter-spacing:.12em;color:#f7e9c8;text-shadow:0 1px 2px rgba(0,0,0,.9);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 1px}
.spine.lean{transform:rotate(-7deg) translateX(4px)}
.spine.lean:hover{transform:rotate(-7deg) translate(4px,-10px)}
.coverOnShelf{flex:none;width:96px;cursor:pointer;transition:transform .35s}.coverOnShelf:hover{transform:translateY(-10px) rotate(-1deg)}
.decor{flex:none;align-self:flex-end;position:relative;z-index:2;pointer-events:none}
.shelfhd{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.shelfhd .sp{flex:1}

/* ---------- candles ---------- */
.candle{position:relative;display:inline-block;width:var(--w,14px);height:var(--h,60px)}
.candle .wax{position:absolute;bottom:0;left:0;right:0;top:12px;border-radius:3px 3px 2px 2px;background:linear-gradient(90deg,#b9a77f,#f6ecd2 35%,#fff8e6 50%,#e8dab6 70%,#a8956b)}
.candle .wax::before{content:"";position:absolute;top:-2px;left:-1px;right:-1px;height:6px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#fff4d8,#d8c69c)}
.candle .drip{position:absolute;top:2px;width:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,#d7c69c,#fff6dc,#cdbb8d)}
.candle .wick{position:absolute;left:50%;top:6px;width:1.5px;height:7px;margin-left:-.75px;background:#1a110a;border-radius:1px}
.candle .flame{position:absolute;left:50%;top:-10px;width:9px;height:17px;margin-left:-4.5px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 75%,#fff 0,#fff6c8 20%,#ffcf5a 45%,#ff8a1e 70%,rgba(255,80,20,0) 72%);filter:blur(.3px);transform-origin:50% 90%;animation:flame 1.6s ease-in-out infinite alternate}
.candle .flame::after{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:radial-gradient(circle,rgba(255,190,90,.35),rgba(255,160,60,.08) 45%,transparent 70%);animation:halo 2.3s ease-in-out infinite alternate}
.candle.out .flame{display:none}
.candle.out .smoke{position:absolute;left:50%;top:-20px;width:2px;height:22px;margin-left:-1px;background:linear-gradient(transparent,rgba(200,200,200,.35));filter:blur(1px);animation:smoke 3s infinite}
@keyframes flame{0%{transform:scale(1,1) rotate(-2deg)}30%{transform:scale(.92,1.08) rotate(2deg)}60%{transform:scale(1.05,.94) rotate(-1deg)}100%{transform:scale(.96,1.05) rotate(3deg)}}
@keyframes halo{from{opacity:.7;transform:scale(.95)}to{opacity:1;transform:scale(1.08)}}
@keyframes smoke{0%{opacity:0;transform:translateY(4px) scaleX(1)}40%{opacity:.8}100%{opacity:0;transform:translateY(-16px) scaleX(2.4) skewX(20deg)}}

/* ---------- modal & drawer ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(5,3,2,.68);backdrop-filter:blur(6px);display:grid;place-items:center;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{width:min(640px,94vw);max-height:90vh;overflow:auto;border-radius:22px;padding:22px 24px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);box-shadow:0 40px 80px -20px rgba(0,0,0,.95);animation:pop .35s cubic-bezier(.2,.9,.3,1.2);position:relative}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}}
.modal .x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);color:var(--dim)}
.modal .x:hover{color:var(--gilt2);border-color:var(--gilt)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:85;width:min(560px,96vw);overflow:auto;background:linear-gradient(180deg,var(--panel2),var(--panel));border-left:1px solid var(--line2);box-shadow:-40px 0 80px -20px rgba(0,0,0,.95);padding:24px 26px 50px;animation:slide .45s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(100%)}}
.results{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.res{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);transition:border .2s}
.res:hover{border-color:var(--gilt3)}
.res .cover{width:44px}
.res b{font-family:var(--fN);font-size:16px;display:block;line-height:1.1}
.plus{width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;font-size:18px;box-shadow:0 4px 10px -4px #000}
.toastbox{position:fixed;z-index:120;right:22px;bottom:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{width:330px;padding:14px 16px;border-radius:16px;background:linear-gradient(180deg,#2a1d14,#150e09);border:1px solid var(--gilt3);box-shadow:0 20px 40px -10px rgba(0,0,0,.95),0 0 30px -10px rgba(var(--glow),.4);color:#f0e2c2;animation:toastIn .5s cubic-bezier(.2,.9,.3,1.2);position:relative;overflow:hidden}
.toast::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 10% 0%,rgba(var(--glow),.18),transparent 60%)}
.toast .sym{font-size:22px;color:var(--gilt2);float:left;margin-right:10px;text-shadow:0 0 12px rgba(var(--glow),.8)}
.toast b{font-family:var(--fH);letter-spacing:.08em;font-size:13px;display:block;color:#f6dba0}
.toast p{font-size:13px;opacity:.9}
@keyframes toastIn{from{opacity:0;transform:translateX(30px) scale(.95)}}

/* ---------- home ---------- */
.home{display:grid;grid-template-columns:1.55fr 1fr .9fr;gap:16px}
.home .wide{grid-column:span 2}
.nowcard{display:grid;grid-template-columns:120px 1fr;gap:18px}
.nowcard .book3d{--th:7px}
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.prog div{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.prog b{display:block;font-family:var(--fT);font-size:18px;color:var(--ivory)}.prog small{font-size:9px;font-family:var(--fH);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.spark{width:100%;height:110px;display:block}
.streak .num{font-family:var(--fT);font-size:44px;line-height:.9;color:var(--accent2);text-shadow:0 0 20px rgba(192,68,74,.4)}
.candlerow{display:grid;grid-template-columns:42px repeat(7,1fr);align-items:end;gap:4px;margin:6px 0;height:46px;position:relative}
.candlerow .lab{font-size:10px;color:var(--dim);font-family:var(--fH);align-self:center}
.candlerow .cw{display:flex;justify-content:center;align-items:flex-end;height:100%;position:relative}
.candlerow::after{content:"";position:absolute;left:42px;right:0;bottom:-2px;height:6px;border-radius:3px;background:var(--wood2) var(--woodtex);background-blend-mode:multiply;box-shadow:0 4px 6px rgba(0,0,0,.6)}
.task{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.task .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--gilt3);flex:none;display:grid;place-items:center;font-size:11px;color:var(--ink)}
.task.done .ck{background:var(--gilt);border-color:var(--gilt)}.task.done span{text-decoration:line-through;opacity:.5}
.task .due{margin-left:auto;font-size:11px;color:var(--dim);font-family:var(--fH);letter-spacing:.06em}
.task.late .due{color:var(--accent2)}
.journalmini{display:flex;gap:14px;align-items:center}
.minijournal{width:64px;height:84px;border-radius:3px 7px 7px 3px;position:relative;background:var(--jc,#4a5a3a) var(--leathertex);background-blend-mode:multiply;box-shadow:inset 6px 0 0 rgba(0,0,0,.35),inset 7px 0 0 rgba(255,255,255,.08),0 10px 18px -6px #000}
.minijournal::after{content:"";position:absolute;right:10px;top:-3px;width:8px;height:22px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
.minijournal span{position:absolute;inset:auto 8px 14px 14px;font-family:var(--fS);color:var(--gilt2);font-size:13px;line-height:1}
.challengeBig{display:flex;align-items:baseline;gap:6px;font-family:var(--fT)}
.challengeBig b{font-size:46px;color:#fff3e0;line-height:.9}.challengeBig span{font-size:18px;color:#ffd9c0}
.mbars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:58px}
.mbars i{display:block;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,var(--accent2),var(--accent));min-height:3px;opacity:.85}
.mbars i.cur{background:linear-gradient(180deg,var(--gilt2),var(--gilt));box-shadow:0 0 10px rgba(var(--glow),.5)}
.mlab{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:9px;text-align:center;color:var(--dim);font-family:var(--fH);margin-top:3px}
.pick{display:flex;gap:12px;align-items:center}
.pick .cover{width:62px;flex:none}

/* ---------- journal ---------- */
.journalwrap{display:grid;grid-template-columns:240px 1fr;gap:22px}
.jcover{width:180px;height:240px;margin:0 auto;border-radius:4px 12px 12px 4px;position:relative;background:var(--jc,#4a5a3a) var(--leathertex);background-blend-mode:multiply;box-shadow:inset 14px 0 0 rgba(0,0,0,.32),inset 15px 0 0 rgba(255,255,255,.07),inset 0 0 40px rgba(0,0,0,.45),0 30px 40px -18px #000;transform:perspective(700px) rotateY(-14deg);transition:transform .6s}
.jcover:hover{transform:perspective(700px) rotateY(-4deg)}
.jcover::before{content:"";position:absolute;inset:16px 16px 16px 28px;border:1.5px solid rgba(201,168,106,.55);border-radius:4px;box-shadow:inset 0 0 0 4px rgba(0,0,0,.15),inset 0 0 0 5px rgba(201,168,106,.3)}
.jcover .t{position:absolute;left:30px;right:16px;top:70px;text-align:center;font-family:var(--fS);font-size:28px;color:var(--gilt2);text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 8px rgba(var(--glow),.3);line-height:1}
.jcover .s{position:absolute;left:30px;right:16px;bottom:34px;text-align:center;font-family:var(--fH);font-size:9px;letter-spacing:.22em;color:var(--gilt)}
.jcover .rib{position:absolute;right:26px;bottom:-24px;width:10px;height:44px;background:linear-gradient(90deg,#5a1014,var(--accent2),#5a1014);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:560px;border-radius:10px;padding:14px;background:var(--jc,#4a5a3a) var(--leathertex);background-blend-mode:multiply;box-shadow:0 40px 60px -30px #000,inset 0 0 60px rgba(0,0,0,.5);perspective:2200px}
.page{position:relative;padding:34px 34px 40px 44px;background:#f4ead3 var(--papertex);background-blend-mode:multiply;color:#2a1d12;overflow:hidden;
  background-image:var(--papertex),repeating-linear-gradient(180deg,transparent 0 31px,rgba(70,90,140,.22) 31px 32px);background-position:0 0,0 56px}
.page.l{border-radius:6px 2px 2px 6px;box-shadow:inset -30px 0 40px -20px rgba(0,0,0,.35)}
.page.r{border-radius:2px 6px 6px 2px;box-shadow:inset 30px 0 40px -20px rgba(0,0,0,.35)}
.page.l::before{content:"";position:absolute;top:0;bottom:0;left:30px;width:1px;background:rgba(170,40,40,.35)}
.page .entry{margin-bottom:22px;font-family:var(--fW);font-size:15px;line-height:32px;color:#2b2140}
.page .entry .d{font-family:var(--fM);font-size:15px;color:#8c2a2e;line-height:32px}
.page .entry .bk{display:inline-block;font-family:var(--fH);font-size:10px;letter-spacing:.14em;color:#8c2a2e;border:1px solid #8c2a2e;padding:0 6px;line-height:18px;margin-left:6px;vertical-align:middle}
.page .entry mark{background:linear-gradient(transparent 40%,rgba(230,120,140,.45) 40%,rgba(230,120,140,.45) 85%,transparent 85%);color:inherit}
.page .tape{position:absolute;right:28px;width:56px;transform:rotate(4deg);box-shadow:0 6px 10px -4px rgba(0,0,0,.4)}
.page .tape::before{content:"";position:absolute;left:12px;right:12px;top:-8px;height:16px;background:rgba(240,190,200,.7);transform:rotate(-6deg);z-index:2}
.page .pn{position:absolute;bottom:12px;font-family:var(--fM);font-size:12px;color:#8a7b5f}
.page.l .pn{left:44px}.page.r .pn{right:34px}
.rings{position:absolute;left:50%;top:20px;bottom:20px;width:20px;margin-left:-10px;display:flex;flex-direction:column;justify-content:space-around;z-index:3}
.rings i{display:block;width:20px;height:9px;border-radius:9px;background:linear-gradient(180deg,#f2f2f2,#9a9a9a 60%,#5a5a5a);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.flip{position:absolute;top:14px;bottom:14px;right:14px;width:calc(50% - 14px);transform-origin:left center;transform-style:preserve-3d;z-index:4;animation:turn .8s cubic-bezier(.4,.1,.2,1) forwards;pointer-events:none}
.flip.back{left:14px;right:auto;transform-origin:right center;animation:turnb .8s cubic-bezier(.4,.1,.2,1) forwards}
.flip .face{position:absolute;inset:0;background:#efe3c8 var(--papertex);background-blend-mode:multiply;border-radius:2px 6px 6px 2px;backface-visibility:hidden;box-shadow:inset 30px 0 40px -20px rgba(0,0,0,.35)}
@keyframes turn{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes turnb{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.notegrid{columns:3 260px;column-gap:14px}
.note{break-inside:avoid;margin-bottom:14px;padding:14px 16px;border-radius:12px;background:#efe4cb var(--papertex);background-blend-mode:multiply;color:#2a1d12;box-shadow:0 10px 18px -10px #000;position:relative}
.note .q{font-family:var(--fN);font-size:18px;font-style:italic;line-height:1.3}
.note .src{margin-top:8px;font-family:var(--fH);font-size:10px;letter-spacing:.14em;color:#8c2a2e}
.note.word b{font-family:var(--fT);font-size:20px}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal .dow{font-family:var(--fH);font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;padding-left:4px}
.cal .day{position:relative;min-height:92px;border-radius:12px;padding:7px 8px;border:1px dashed var(--line);background:rgba(0,0,0,.12);cursor:pointer;transition:border .2s}
.cal .day:hover{border-color:var(--gilt3)}
.cal .day.read{border-style:solid;border-color:transparent}
.cal .day .n{font-family:var(--fT);font-size:15px}
.cal .day .pg{position:absolute;top:8px;right:8px;font-size:10px;color:var(--parch);opacity:.8;font-family:var(--fH)}
.cal .day .cv{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}.cal .day .cv .cover{width:20px}
.cal .day .dots{position:absolute;right:7px;bottom:7px;display:flex;gap:3px}
.cal .day .dots i{width:7px;height:7px;border-radius:50%}
.cal .day.today{box-shadow:0 0 0 2px var(--gilt) inset}
.cal .day.other{opacity:.35}
.ganttrow{display:grid;grid-template-columns:220px 1fr;gap:12px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.gantt{display:grid;gap:2px}.gantt i{height:12px;border-radius:3px;background:rgba(255,255,255,.05)}.gantt i.on{background:linear-gradient(180deg,var(--accent2),var(--accent))}

/* ---------- stats ---------- */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.statgrid .s2{grid-column:span 2}.statgrid .s3{grid-column:span 3}
svg text:not([font-family]){font-family:var(--fH)}
.receipt{background:#f3ead4 var(--papertex);background-blend-mode:multiply;color:#2a1d12;font-family:'Courier Prime','Courier New',monospace;font-size:13px;padding:18px 20px 26px;border-radius:4px;box-shadow:0 20px 30px -16px #000;position:relative;
  -webkit-mask:radial-gradient(circle 6px at 8px 100%,transparent 6px,#000 6.5px) 0 0/16px 100% repeat-x;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 51% repeat-x,linear-gradient(#000 0 0) top/100% 50% no-repeat}
.receipt .ln{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(0,0,0,.25);padding:3px 0}
.graves{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;padding:10px 0 0;min-height:150px;background:linear-gradient(180deg,transparent 70%,rgba(40,60,30,.35) 70%)}
.grave{width:92px;height:118px;border-radius:46px 46px 4px 4px;background:linear-gradient(90deg,#3a3a3a,#7a7a76 40%,#5a5a56 70%,#2e2e2c);box-shadow:inset 0 0 20px rgba(0,0,0,.5),0 10px 14px -6px #000;color:#e6e1d4;text-align:center;padding:22px 8px 8px;font-size:11px;line-height:1.2;position:relative}
.grave b{display:block;font-family:var(--fH);font-size:11px;margin:4px 0}
.grave .rip{font-family:var(--fT);font-size:16px;color:#cfc9b8}

/* ---------- recap cards ---------- */
.cards{display:flex;gap:16px;overflow-x:auto;padding:6px 4px 20px}
.rcard{flex:none;width:270px;height:480px;border-radius:22px;padding:22px;position:relative;overflow:hidden;color:#f3e6c8;box-shadow:0 30px 50px -24px #000;background:radial-gradient(120% 90% at 20% 0%,#3a1a16,#120a07 70%)}
.rcard.alt{background:radial-gradient(120% 90% at 20% 0%,var(--accent2),var(--accent) 45%,#2a0a0c)}
.rcard.bone{background:#efe4cb var(--papertex);background-blend-mode:multiply;color:#2a1d12}
.rcard .big{font-family:var(--fT);font-size:76px;line-height:.9}
.rcard .ft{position:absolute;left:22px;right:22px;bottom:18px;display:flex;justify-content:space-between;font-family:var(--fH);font-size:10px;letter-spacing:.16em;opacity:.8}

/* ---------- phonograph ---------- */
#phono{position:fixed;right:22px;bottom:22px;z-index:70;width:64px;height:64px;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 35% 30%,#3a2a1c,#0d0806);border:1px solid var(--gilt3);box-shadow:0 14px 24px -8px #000,0 0 0 4px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .3s}
#phono:hover{transform:scale(1.06)}
#phono .disc{width:44px;height:44px;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 1px,#1c1c1c 1px 2.5px);box-shadow:0 0 0 1px #000;position:relative}
#phono .disc::after{content:"";position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle,#e0c27a 20%,var(--accent) 22%)}
#phono.playing .disc{animation:spin 1.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.phpanel{position:fixed;right:22px;bottom:98px;z-index:71;width:330px;border-radius:22px;padding:18px;background:linear-gradient(180deg,#24180f,#0f0a06);border:1px solid var(--gilt3);box-shadow:0 30px 60px -20px #000;color:#f0e2c2;animation:pop .35s}
.phpanel h3{font-family:var(--fT);font-size:18px;color:var(--gilt2);text-align:center}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
